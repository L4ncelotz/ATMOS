name: Sync labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', print what would change without writing."
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            const dryRun = (${{ inputs.dry_run }} === 'true');

            const raw = fs.readFileSync('.github/labels.yml', 'utf8');
            const parsed = yaml.load(raw);
            const labels = parsed.labels || [];

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const byName = new Map(existing.map(l => [l.name, l]));

            const changes = [];
            for (const want of labels) {
              const have = byName.get(want.name);
              if (!have) {
                changes.push({op: 'create', name: want.name, color: want.color, description: want.description});
              } else if (have.color !== want.color || (have.description || '') !== (want.description || '')) {
                changes.push({op: 'update', from: have.name, to: want.name, color: want.color, description: want.description, old_color: have.color});
              }
            }

            core.info(`Found ${labels.length} desired, ${existing.length} existing.`);
            core.info(`Changes needed: ${changes.length}`);

            if (dryRun) {
              for (const c of changes) {
                core.info(`[dry-run] ${c.op} ${c.from || ''} -> ${c.to || c.name} (color ${c.color})`);
              }
              return;
            }

            for (const c of changes) {
              if (c.op === 'create') {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: c.name,
                  color: c.color,
                  description: c.description,
                });
                core.info(`created ${c.name}`);
              } else if (c.op === 'update') {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: c.from,
                  new_name: c.to,
                  color: c.color,
                  description: c.description,
                });
                core.info(`updated ${c.from} -> ${c.to}`);
              }
            }
            core.info('done');
